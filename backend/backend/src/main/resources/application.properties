# Default local profile uses H2 so the backend can start without MySQL.
# To use MySQL instead, copy application-mysql.properties.example to
# application-mysql.properties, set credentials, and run with:
#   --spring.profiles.active=mysql

spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:gigshield;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
